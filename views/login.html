<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin sign in | Real Easy Sites</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:20px}
  .box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;width:100%;max-width:380px;box-shadow:var(--shadow)}
  .box h1{font-size:1.6rem;margin-bottom:18px}
  .box label{display:block;font-weight:600;font-size:.9rem;margin-bottom:14px}
  .box input{display:block;width:100%;margin-top:6px;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fbf9f4}
  .err{color:#c0392b;font-weight:600;font-size:.9rem;margin-bottom:12px}
</style></head>
<body>
<form class="box" method="post" action="/admin/login">
  <h1>Real Easy Sites admin</h1>
  <p class="err" id="err" hidden></p>
  <label>Username<input name="username" autocomplete="username" required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn btn-block" type="submit">Sign in</button>
</form>
<script>
  var e = new URLSearchParams(location.search).get('e');
  var el = document.getElementById('err');
  if (e === 'bad') { el.textContent = 'Wrong username or password.'; el.hidden = false; }
  if (e === 'locked') { el.textContent = 'Admin is locked until ADMIN_PASSWORD is set on the server.'; el.hidden = false; }
</script>
</body></html>
